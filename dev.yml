services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - network

  app:
    build: .
    restart: always
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - PHONE=${PHONE}
      - DATABASE_DSN=postgresql+asyncpg://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
    depends_on:
      - postgres
    volumes:
      - .:/app
      - ./data/sessions:/app/data/sessions
    command: uv run python main.py
    networks:
      - network

volumes:
  postgres:
    driver: local
  redis:
    driver: local

networks:
  network:
    driver: bridge
